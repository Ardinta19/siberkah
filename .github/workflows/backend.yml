name: Backend
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: siberkah_test
          MARIADB_ROOT_PASSWORD: ci_only
        ports: ['3306:3306']
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: siberkah_test
      DB_USERNAME: root
      DB_PASSWORD: ci_only
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mbstring, dom
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cp .env.example .env && composer install --no-interaction --prefer-dist && php artisan key:generate
      - run: npm ci && npm run build
      - run: php artisan migrate --force && php artisan test
